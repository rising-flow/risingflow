<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Flow - Pixel Block</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css"/>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pixel_block.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <a href="./">
                <img src="images/rising_flow_logo.png" alt="Rising Flow Logo">
            </a>
        </div>
        <div class="language-switcher">
            <button id="language-flag" data-lang="en">
                <span class="fi fi-gb" title="Switch to English"></span> </button>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: var(--color-primary-yellow); z-index: 1050;">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#products" id="productsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="products-link-text">Produtos</span>
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="productsDropdown" style="z-index: 2000;">
                                <li><a class="dropdown-item" href="./pixel_block" id="pixel-block-link">Pixel Block</a></li>
                            </ul>
                        </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#events" id="eventsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span id="events-link-text">Eventos</span>
              </a>
                             <ul class="dropdown-menu" aria-labelledby="eventsDropdown" style="z-index: 2000;">
                 <li><a class="dropdown-item" href="./upcoming_events">Próximos Eventos</a></li>
                 <li><a class="dropdown-item" href="./past_events">Eventos Passados</a></li>
               </ul>
            </li>
            <li class="nav-item"><a class="nav-link" href="./song_search" id="song-search-link">Buscador de Músicas</a></li>
            <li class="nav-item"><a class="nav-link" href="./contact" id="contact-link">Contato</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
        <section class="pixel-block-hero">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 text-center">
                        <h1 id="pixel-block-title">Pixel Block</h1>
                        <p id="pixel-block-subtitle">Descubra nossa coleção exclusiva de ícones pixelados</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="pixel-block-gallery">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <h2 id="gallery-title">Modelos Pixel Block</h2>
                        <div class="gallery-grid">
                            <!-- Products will be loaded dynamically from JSON -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Rising Flow. All rights reserved.</p>
    </footer>

    <!-- Simple Full Screen Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="image-viewer">
                        <img id="modalImage" src="" alt="Full Screen Image" class="fullscreen-image">
                        
                        <!-- Simple Navigation -->
                        <div class="image-navigation">
                            <button id="prevBtn" class="nav-btn" style="display: none;">‹</button>
                            <span id="imageCounter" class="image-counter" style="display: none;">1 / 1</span>
                            <button id="nextBtn" class="nav-btn" style="display: none;">›</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modular JavaScript architecture -->
    <script src="js/services/PixelBlockService.js"></script>
    <script src="js/pages/pixel_block.js"></script>
    <script src="js/main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
